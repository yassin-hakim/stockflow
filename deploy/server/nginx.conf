server {
    listen 80;
    listen [::]:80;
    server_name 52.1.135.53;
    root /opt/stockflow/app/apps/frontend/dist/frontend/browser;
    index index.html;
    client_max_body_size 64k;
    access_log /var/log/nginx/stockflow-access.log;
    error_log /var/log/nginx/stockflow-error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
    location = /health/ready {
        proxy_pass http://127.0.0.1:3100;
    }
    location ~ /\. { deny all; }
    location ~* \.(?:css|js|ico|png|svg|woff2?)$ {
        try_files $uri =404;
        expires 7d;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
